# Workspace-level tool configuration. Each service/library has its own
# pyproject.toml for packaging; this file only configures shared tooling.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "S",        # bandit (security)
  "SIM",      # simplify
  "RUF",
]

[tool.ruff.lint.isort]
known-first-party = [
  "sentinelflow_common",
  "sentinelflow_gateway",
  "sentinelflow_dockerfile_scanner",
  "sentinelflow_image_scanner",
  "sentinelflow_api_scanner",
  "sentinelflow_policy_engine",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "libs/common/src,services/gateway/src,services/scanner-dockerfile/src,services/scanner-image/src,services/scanner-api/src,services/policy-engine/src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["libs", "services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
