name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main or a tag: it may be mid-way through publishing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HADOLINT_VERSION: v2.12.0
  OPA_IMAGE: openpolicyagent/opa:1.22.4@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf

jobs:
  policy-tests:
    name: Rego policies (fmt, strict check, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: opa fmt
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" fmt --list --fail /p
      - name: opa check --strict
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" check --strict /p
      - name: opa test
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" test -v /p

  observability-config:
    name: Prometheus rules and Grafana dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: promtool check config (includes alert rules)
        run: >-
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool
          prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - name: Dashboard JSON is valid
        run: python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['panels'], 'no panels'" deploy/grafana/dashboards/sentinelflow-compliance.json

  helm:
    name: Helm chart (lint, render, schema-validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: helm lint
        run: helm lint deploy/helm/sentinelflow --strict --set secrets.adminToken=ci
      - name: Validate rendered manifests against Kubernetes schemas
        run: |
          # shellcheck disable=SC2086  # $values is intentionally split into flags
          for values in "" "-f deploy/kind/values-kind.yaml"; do
            helm template sentinelflow deploy/helm/sentinelflow $values --set secrets.adminToken=ci \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary -kubernetes-version 1.36.0
          done
      - name: Chart refuses to install without an admin token
        run: |
          if helm template x deploy/helm/sentinelflow >/dev/null 2>&1; then
            echo "expected failure without secrets.adminToken"; exit 1
          fi

  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow
          POSTGRES_DB: sentinelflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Run the test suite against real Postgres and NATS, not just in-memory fakes.
      SENTINELFLOW_TEST_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow_test
      SENTINELFLOW_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow
      SENTINELFLOW_TEST_NATS_URL: nats://127.0.0.1:4222
      SENTINELFLOW_TEST_OPA_URL: http://127.0.0.1:8181
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml

      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js

      - name: Start OPA with SentinelFlow policies
        run: >-
          docker run -d --name opa -p 8181:8181
          -v "$PWD/services/policy-engine/policies:/policies:ro" "$OPA_IMAGE"
          run --server --addr=0.0.0.0:8181 --ignore='*_test.rego' /policies

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: >-
          mypy libs/common/src services/gateway/src services/scanner-dockerfile/src
          services/scanner-image/src services/scanner-api/src services/policy-engine/src

      - name: Create test database
        run: PGPASSWORD=sentinelflow psql -h localhost -U sentinelflow -c "CREATE DATABASE sentinelflow_test"

      - name: Pytest
        run: >-
          pytest
          --cov=sentinelflow_common --cov=sentinelflow_gateway --cov=sentinelflow_dockerfile_scanner
          --cov=sentinelflow_image_scanner --cov=sentinelflow_api_scanner
          --cov=sentinelflow_policy_engine --cov-report=term-missing

      - name: Migrations apply cleanly and match models
        working-directory: services/gateway
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  docker-build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: gateway, dockerfile: services/gateway/Dockerfile }
          - { image: scanner-dockerfile, dockerfile: services/scanner-dockerfile/Dockerfile }
          - { image: scanner-image, dockerfile: services/scanner-image/Dockerfile }
          - { image: scanner-api, dockerfile: services/scanner-api/Dockerfile }
          - { image: policy-engine, dockerfile: services/policy-engine/Dockerfile }
          - { image: policy-opa, dockerfile: services/policy-engine/opa.Dockerfile }
          - { image: webhook-receiver, dockerfile: tools/webhook-receiver/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t sentinelflow/${{ matrix.image }}:ci .

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [lint-and-test, policy-tests]
    env:
      SENTINELFLOW_ADMIN_TOKEN: ci-only-admin-token-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build images
        run: docker compose build --quiet
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test (scans, policies, signed webhooks)
        run: |
          pip install httpx
          python scripts/smoke_test.py
      - name: Observability (Prometheus targets, metrics, Grafana dashboard)
        run: python scripts/check_observability.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Container status"
          docker compose ps -a
          echo "::endgroup::"
          docker compose logs --no-color --tail 40
      - name: Tear down
        if: always()
        run: docker compose down -v

  e2e-kubernetes:
    name: End-to-end (Kubernetes, kind)
    runs-on: ubuntu-latest
    needs: [lint-and-test, policy-tests, helm]
    env:
      SENTINELFLOW_ADMIN_TOKEN: ci-only-admin-token-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.22.1
      - name: Install kind
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - name: Deploy (cluster, images, helm install, helm test)
        run: bash scripts/deploy-kind.sh
      - name: Smoke test (scans, policies, signed webhooks)
        run: |
          pip install httpx
          kubectl -n sentinelflow port-forward svc/sentinelflow-gateway 8000:8000 >/dev/null 2>&1 &
          kubectl -n sentinelflow port-forward svc/sentinelflow-webhook-receiver 8090:8080 >/dev/null 2>&1 &
          sleep 5
          python scripts/smoke_test.py --webhook-url http://sentinelflow-webhook-receiver:8080/hook
      - name: NetworkPolicy enforcement
        run: bash scripts/check_network_policies.sh sentinelflow
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n sentinelflow get pods,events -o wide || true
          kubectl -n sentinelflow logs -l app.kubernetes.io/name=sentinelflow --all-containers --tail 40 --prefix || true

  release:
    name: Release
    # Publish only from main or a version tag, and only after every check has passed.
    if: github.event_name == 'push'
    needs: [lint-and-test, policy-tests, observability-config, helm, docker-build, e2e, e2e-kubernetes, secret-scan]
    permissions:
      contents: read
      packages: write
      id-token: write
      security-events: write
    uses: ./.github/workflows/release.yml

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
