name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow
          POSTGRES_DB: sentinelflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Run the test suite against real Postgres, not just SQLite.
      SENTINELFLOW_TEST_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow_test
      SENTINELFLOW_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy libs/common/src services/gateway/src

      - name: Create test database
        run: PGPASSWORD=sentinelflow psql -h localhost -U sentinelflow -c "CREATE DATABASE sentinelflow_test"

      - name: Pytest
        run: pytest --cov=sentinelflow_common --cov=sentinelflow_gateway --cov-report=term-missing

      - name: Migrations apply cleanly and match models
        working-directory: services/gateway
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  docker-build:
    name: Build gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: services/gateway/Dockerfile
      - name: Build
        run: docker build -f services/gateway/Dockerfile -t sentinelflow/gateway:ci .

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
