name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HADOLINT_VERSION: v2.12.0
  OPA_IMAGE: openpolicyagent/opa:1.21.1@sha256:d3a9a6bd4fbcb0f4403294b0d0b239b07be163ac118a46df7d50045b52e52053

jobs:
  policy-tests:
    name: Rego policies (fmt, strict check, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: opa fmt
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" fmt --list --fail /p
      - name: opa check --strict
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" check --strict /p
      - name: opa test
        run: docker run --rm -v "$PWD/services/policy-engine/policies:/p" "$OPA_IMAGE" test -v /p

  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinelflow
          POSTGRES_PASSWORD: sentinelflow
          POSTGRES_DB: sentinelflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelflow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Run the test suite against real Postgres and NATS, not just in-memory fakes.
      SENTINELFLOW_TEST_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow_test
      SENTINELFLOW_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@localhost:5432/sentinelflow
      SENTINELFLOW_TEST_NATS_URL: nats://127.0.0.1:4222
      SENTINELFLOW_TEST_OPA_URL: http://127.0.0.1:8181
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            **/pyproject.toml

      - name: Start NATS with JetStream
        run: docker run -d --name nats -p 4222:4222 nats:2.10-alpine -js

      - name: Start OPA with SentinelFlow policies
        run: >-
          docker run -d --name opa -p 8181:8181
          -v "$PWD/services/policy-engine/policies:/policies:ro" "$OPA_IMAGE"
          run --server --addr=0.0.0.0:8181 --ignore='*_test.rego' /policies

      - name: Install hadolint
        run: |
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: >-
          mypy libs/common/src services/gateway/src services/scanner-dockerfile/src
          services/scanner-image/src services/scanner-api/src services/policy-engine/src

      - name: Create test database
        run: PGPASSWORD=sentinelflow psql -h localhost -U sentinelflow -c "CREATE DATABASE sentinelflow_test"

      - name: Pytest
        run: >-
          pytest
          --cov=sentinelflow_common --cov=sentinelflow_gateway --cov=sentinelflow_dockerfile_scanner
          --cov=sentinelflow_image_scanner --cov=sentinelflow_api_scanner
          --cov=sentinelflow_policy_engine --cov-report=term-missing

      - name: Migrations apply cleanly and match models
        working-directory: services/gateway
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  docker-build:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: gateway, dockerfile: services/gateway/Dockerfile }
          - { image: scanner-dockerfile, dockerfile: services/scanner-dockerfile/Dockerfile }
          - { image: scanner-image, dockerfile: services/scanner-image/Dockerfile }
          - { image: scanner-api, dockerfile: services/scanner-api/Dockerfile }
          - { image: policy-engine, dockerfile: services/policy-engine/Dockerfile }
          - { image: policy-opa, dockerfile: services/policy-engine/opa.Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
      - name: Build
        run: docker build -f ${{ matrix.dockerfile }} -t sentinelflow/${{ matrix.image }}:ci .

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [lint-and-test, policy-tests]
    env:
      SENTINELFLOW_ADMIN_TOKEN: ci-only-admin-token-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build images
        run: docker compose build --quiet
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          pip install httpx
          python scripts/smoke_test.py
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::Container status"
          docker compose ps -a
          echo "::endgroup::"
          docker compose logs --no-color --tail 40
      - name: Tear down
        if: always()
        run: docker compose down -v

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
