# Local development stack.  Usage:
#   cp .env.example .env   (then set SENTINELFLOW_ADMIN_TOKEN)
#   docker compose up --build -d --wait
#   python scripts/smoke_test.py

x-gateway-image: &gateway-build
  build:
    context: .
    dockerfile: services/gateway/Dockerfile
  image: sentinelflow/gateway:dev

x-common-env: &common-env
  SENTINELFLOW_DATABASE_URL: postgresql+asyncpg://sentinelflow:sentinelflow@postgres:5432/sentinelflow
  SENTINELFLOW_NATS_URL: nats://nats:4222

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: sentinelflow
      POSTGRES_DB: sentinelflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: during first-start init, Postgres runs a temporary
      # socket-only server that would otherwise report "ready" too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sentinelflow -d sentinelflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"  # monitoring: http://localhost:8222/jsz
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *gateway-build
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *gateway-build
    environment:
      <<: *common-env
      SENTINELFLOW_ADMIN_TOKEN: ${SENTINELFLOW_ADMIN_TOKEN:?set SENTINELFLOW_ADMIN_TOKEN in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  gateway-worker:
    <<: *gateway-build
    command: ["python", "-m", "sentinelflow_gateway.worker"]
    environment:
      <<: *common-env
    healthcheck:  # no HTTP server in the worker: use its loop heartbeat instead
      test: ["CMD", "python", "-m", "sentinelflow_common.health", "--max-age", "60"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  scanner-dockerfile:
    build:
      context: .
      dockerfile: services/scanner-dockerfile/Dockerfile
    image: sentinelflow/scanner-dockerfile:dev
    environment:
      <<: *common-env
    restart: on-failure
    depends_on:
      nats:
        condition: service_healthy

  scanner-image:
    build:
      context: .
      dockerfile: services/scanner-image/Dockerfile
    image: sentinelflow/scanner-image:dev
    environment:
      <<: *common-env
    volumes:
      - trivy-cache:/var/cache/trivy  # vulnerability DB persists across restarts
    restart: on-failure
    depends_on:
      nats:
        condition: service_healthy

  scanner-api:
    build:
      context: .
      dockerfile: services/scanner-api/Dockerfile
    image: sentinelflow/scanner-api:dev
    environment:
      <<: *common-env
      SENTINELFLOW_ALLOWED_HOSTS: ${SENTINELFLOW_ALLOWED_HOSTS:-}
    restart: on-failure
    depends_on:
      nats:
        condition: service_healthy

  opa:
    build:
      context: .
      dockerfile: services/policy-engine/opa.Dockerfile
    image: sentinelflow/policy-opa:dev
    # Not published to the host: only the policy engine talks to OPA.

  policy-engine:
    build:
      context: .
      dockerfile: services/policy-engine/Dockerfile
    image: sentinelflow/policy-engine:dev
    environment:
      <<: *common-env
      SENTINELFLOW_OPA_URL: http://opa:8181
    restart: on-failure
    depends_on:
      nats:
        condition: service_healthy
      opa:
        condition: service_healthy

  notifier:
    <<: *gateway-build
    command: ["python", "-m", "sentinelflow_gateway.notifier"]
    environment:
      <<: *common-env
      # Dev only: lets webhooks reach the in-network demo receiver (exact hostname match).
      SENTINELFLOW_WEBHOOK_PRIVATE_HOSTS: webhook-receiver
    healthcheck:
      test: ["CMD", "python", "-m", "sentinelflow_common.health", "--max-age", "60"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    restart: on-failure
    depends_on:
      migrate:
        condition: service_completed_successfully

  webhook-receiver:  # example receiver for demos and the e2e test
    image: python:3.12-slim
    command: ["python", "/app/receiver.py"]
    user: "10001"
    volumes:
      - ./tools/webhook-receiver:/app:ro
    ports:
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer  # read-only dashboards without login
      GF_SECURITY_ADMIN_PASSWORD: ${SENTINELFLOW_GRAFANA_ADMIN_PASSWORD:-change-me-locally}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sentinelflow-compliance.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
  trivy-cache:
