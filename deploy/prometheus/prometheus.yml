# Prometheus scrape config for the Compose stack. Every SentinelFlow service
# serves /metrics on port 9100 (internal network only, never published).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinelflow
    static_configs:
      - targets: ["gateway:9100"]
        labels: { service: gateway }
      - targets: ["gateway-worker:9100"]
        labels: { service: gateway-worker }
      - targets: ["notifier:9100"]
        labels: { service: notifier }
      - targets: ["scanner-dockerfile:9100"]
        labels: { service: scanner-dockerfile }
      - targets: ["scanner-image:9100"]
        labels: { service: scanner-image }
      - targets: ["scanner-api:9100"]
        labels: { service: scanner-api }
      - targets: ["policy-engine:9100"]
        labels: { service: policy-engine }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
