{{- if not .Values.secrets.existingSecret }}
{{- $name := include "sf.secretName" . }}
{{- /* Reuse the generated Postgres password on upgrade instead of rotating it
       out from under the running database. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sf.labels" . | nindent 4 }}
type: Opaque
data:
  admin-token: {{ required "secrets.adminToken is required (or set secrets.existingSecret)" .Values.secrets.adminToken | b64enc | quote }}
  {{- if .Values.secrets.postgresPassword }}
  postgres-password: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  {{- else if and $existing (index $existing.data "postgres-password") }}
  postgres-password: {{ index $existing.data "postgres-password" | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- /* NATS: one user per service (see files/nats.conf). */}}
  {{- range $name, $c := .Values.components }}
  {{- if $c.nats }}
  {{- $key := printf "nats-password-%s" $name }}
  {{- if and $existing (index $existing.data $key) }}
  {{ $key }}: {{ index $existing.data $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
