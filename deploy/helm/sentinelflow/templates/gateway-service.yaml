{{- $fullname := include "sf.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-gateway
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gatewayService.type }}
  selector:
    {{- include "sf.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.gatewayService.port }}
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-gateway
  labels:
    {{- include "sf.labels" . | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-gateway
                port:
                  name: http
{{- end }}
