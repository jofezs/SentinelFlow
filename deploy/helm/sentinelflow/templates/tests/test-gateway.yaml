# `helm test <release>`: the gateway answers /readyz (process up AND database reachable).
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sf.fullname" . }}-test-gateway
  labels:
    {{- include "sf.selector" (dict "root" . "component" "test") | nindent 4 }}
    sentinelflow.io/gateway-client: "true"
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- include "sf.podSecurityContext" dict | nindent 4 }}
  containers:
    - name: readyz
      image: {{ include "sf.image" (dict "root" . "name" "gateway") }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          url = "http://{{ include "sf.fullname" . }}-gateway:{{ .Values.gatewayService.port }}/readyz"
          body = json.load(urllib.request.urlopen(url, timeout=10))
          assert body == {"status": "ready"}, body
          print("gateway ready:", url)
      securityContext:
        {{- include "sf.containerSecurityContext" . | nindent 8 }}
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
