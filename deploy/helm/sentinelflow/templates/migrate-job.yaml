{{- if .Values.migrations.enabled }}
# Runs `alembic upgrade head` after install (once the database is up) and
# before every upgrade (so new code never runs against an old schema).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sf.fullname" . }}-migrate
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10          # retries while Postgres is still starting
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "sf.selector" (dict "root" . "component" "migrate") | nindent 8 }}
        sentinelflow.io/database: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        {{- include "sf.podSecurityContext" dict | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "sf.image" (dict "root" . "name" "gateway") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          workingDir: /app
          securityContext:
            {{- include "sf.containerSecurityContext" . | nindent 12 }}
          env:
            {{- include "sf.databaseEnv" . | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
{{- end }}
