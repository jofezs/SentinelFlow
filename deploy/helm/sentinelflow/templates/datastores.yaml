{{- $fullname := include "sf.fullname" . -}}
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "sf.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-postgres
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ $fullname }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sf.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sf.selector" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "sf.imagePullSecrets" $ | indent 6 }}
      securityContext:
        {{- include "sf.podSecurityContext" (dict "uid" 70) | nindent 8 }}   # postgres user in the alpine image
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: sentinelflow
            - name: POSTGRES_DB
              value: sentinelflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sf.secretName" . }}
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            {{- include "sf.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            # TCP, so it cannot pass against the socket-only server used during first init.
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "sentinelflow", "-d", "sentinelflow"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "sentinelflow"] }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
{{- if .Values.nats.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "sf.labels" . | nindent 4 }}
data:
  nats.conf: |-
    {{- .Files.Get "files/nats.conf" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  selector:
    {{- include "sf.selector" (dict "root" . "component" "nats") | nindent 4 }}
  ports:
    - name: client
      port: 4222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-nats
  labels:
    {{- include "sf.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ $fullname }}-nats
  replicas: 1
  selector:
    matchLabels:
      {{- include "sf.selector" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sf.selector" (dict "root" . "component" "nats") | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get "files/nats.conf" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- include "sf.imagePullSecrets" $ | indent 6 }}
      securityContext:
        {{- include "sf.podSecurityContext" (dict "uid" 1000) | nindent 8 }}
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            {{- range $name, $c := .Values.components }}
            {{- if $c.nats }}
            - name: NATS_PASSWORD_{{ $name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sf.secretName" $ }}
                  key: nats-password-{{ $name }}
            {{- end }}
            {{- end }}
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          securityContext:
            {{- include "sf.containerSecurityContext" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: "/healthz?js-enabled-only=true", port: monitor }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: monitor }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/nats
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $fullname }}-nats
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
{{- end }}
