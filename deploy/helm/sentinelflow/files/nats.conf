# NATS server configuration: one user per service, least-privilege subject permissions.
#
# Why: without this, any pod that can reach NATS can publish any event. A compromised
# scanner (they parse untrusted input) could publish a forged "policy.evaluated" and turn a
# FAIL into a PASS. Now each service may publish only its own events:
#
#   gateway-worker  scan.requested.<type>, policy.requested     (and manages the stream)
#   scanner-<type>  scan.completed.<type> only                  (the image scanner cannot
#                                                                forge Dockerfile results)
#   policy-engine   policy.evaluated only
#
# Each service also gets its own reply-inbox prefix, so no service can read or inject into
# another's JetStream fetch replies, and may ack only its own consumer's messages.
# Passwords come from the environment ($VAR); there is no anonymous access.

port: 4222
http_port: 8222
jetstream {
  store_dir: /data
}

# JetStream API subjects every consumer needs for its own durable consumer <d>.
# (NATS config has no functions, so each user spells these out.)

authorization {
  users: [
    {
      user: gateway-worker
      password: $NATS_PASSWORD_GATEWAY_WORKER
      permissions: {
        publish: {
          allow: [
            "scan.requested.*", "policy.requested",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES",
            "$JS.API.STREAM.INFO.SENTINELFLOW", "$JS.API.STREAM.CREATE.SENTINELFLOW",
            "$JS.API.STREAM.UPDATE.SENTINELFLOW",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.gateway-scan-results",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.gateway-scan-results",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.gateway-scan-results.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.gateway-scan-results",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.gateway-scan-results",
            "$JS.ACK.SENTINELFLOW.gateway-scan-results.>",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.gateway-policy",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.gateway-policy",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.gateway-policy.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.gateway-policy",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.gateway-policy",
            "$JS.ACK.SENTINELFLOW.gateway-policy.>"
          ]
        }
        subscribe: { allow: ["_INBOX.gateway-worker.>"] }
      }
    }
    {
      user: policy-engine
      password: $NATS_PASSWORD_POLICY_ENGINE
      permissions: {
        publish: {
          allow: [
            "policy.evaluated",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.SENTINELFLOW",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.policy-engine",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.policy-engine",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.policy-engine.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.policy-engine",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.policy-engine",
            "$JS.ACK.SENTINELFLOW.policy-engine.>"
          ]
        }
        subscribe: { allow: ["_INBOX.policy-engine.>"] }
      }
    }
    {
      user: scanner-dockerfile
      password: $NATS_PASSWORD_SCANNER_DOCKERFILE
      permissions: {
        publish: {
          allow: [
            "scan.completed.dockerfile",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.SENTINELFLOW",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.scanner-dockerfile",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-dockerfile",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-dockerfile.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.scanner-dockerfile",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.scanner-dockerfile",
            "$JS.ACK.SENTINELFLOW.scanner-dockerfile.>"
          ]
        }
        subscribe: { allow: ["_INBOX.scanner-dockerfile.>"] }
      }
    }
    {
      user: scanner-image
      password: $NATS_PASSWORD_SCANNER_IMAGE
      permissions: {
        publish: {
          allow: [
            "scan.completed.image",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.SENTINELFLOW",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.scanner-image",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-image",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-image.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.scanner-image",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.scanner-image",
            "$JS.ACK.SENTINELFLOW.scanner-image.>"
          ]
        }
        subscribe: { allow: ["_INBOX.scanner-image.>"] }
      }
    }
    {
      user: scanner-api
      password: $NATS_PASSWORD_SCANNER_API
      permissions: {
        publish: {
          allow: [
            "scan.completed.api_endpoint",
            "$JS.API.INFO", "$JS.API.STREAM.NAMES", "$JS.API.STREAM.INFO.SENTINELFLOW",
            "$JS.API.CONSUMER.INFO.SENTINELFLOW.scanner-api",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-api",
            "$JS.API.CONSUMER.CREATE.SENTINELFLOW.scanner-api.>",
            "$JS.API.CONSUMER.DURABLE.CREATE.SENTINELFLOW.scanner-api",
            "$JS.API.CONSUMER.MSG.NEXT.SENTINELFLOW.scanner-api",
            "$JS.ACK.SENTINELFLOW.scanner-api.>"
          ]
        }
        subscribe: { allow: ["_INBOX.scanner-api.>"] }
      }
    }
  ]
}
