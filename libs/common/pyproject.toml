[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow-common"
version = "0.2.0"
description = "Shared event schemas and messaging for SentinelFlow services"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "nats-py>=2.9",
  "httpx>=0.27",
  "httpcore>=1.0",
  "prometheus-client>=0.21",
]

[tool.setuptools.packages.find]
where = ["src"]
