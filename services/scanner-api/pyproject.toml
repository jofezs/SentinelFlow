[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow-scanner-api"
version = "0.1.0"
description = "SentinelFlow API endpoint scanner: TLS, security headers, cookies, CORS (SSRF-guarded)"
requires-python = ">=3.12"
dependencies = ["sentinelflow-common", "pydantic-settings>=2.6", "httpx>=0.27", "httpcore>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
