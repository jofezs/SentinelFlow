[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow-policy-engine"
version = "0.1.0"
description = "SentinelFlow policy engine: evaluates findings against Rego policies via OPA"
requires-python = ">=3.12"
dependencies = ["sentinelflow-common", "pydantic-settings>=2.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]
