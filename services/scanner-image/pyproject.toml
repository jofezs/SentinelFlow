[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow-scanner-image"
version = "0.1.0"
description = "SentinelFlow container image scanner (Trivy: vulnerabilities and secrets)"
requires-python = ">=3.12"
dependencies = ["sentinelflow-common", "pydantic-settings>=2.6"]

[tool.setuptools.packages.find]
where = ["src"]
